<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог интерьеров SAMP</title>
<style>
  /* Базовые настройки и фон */
  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    max-width: 900px; 
    margin: 40px auto; 
    padding: 0 20px; 
    background-color: #121212; 
    color: #e0e0e0; 
    line-height: 1.5;
  }
  
  h1 { 
    text-align: center; 
    color: #ffffff; 
    margin-bottom: 40px; 
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  /* Убираем стандартные маркеры у всех спойлеров */
  summary { list-style: none; outline: none; }
  summary::-webkit-details-marker { display: none; }

  /* ================= БОЛЬШИЕ РАЗДЕЛЫ ================= */
  .category { 
    margin-bottom: 25px; 
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    overflow: hidden;
    border: 1px solid #333;
  }

  .category > summary { 
    font-size: 20px; 
    font-weight: 600; 
    cursor: pointer; 
    padding: 18px 20px; 
    background: linear-gradient(145deg, #2b2b2b, #1f1f1f);
    color: #ffffff; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.3s ease;
  }

  .category > summary:hover { 
    background: linear-gradient(145deg, #333333, #252525);
  }

  /* Красивая стрелочка для разделов (плюс/минус) */
  .category > summary::after {
    content: '+';
    font-size: 24px;
    color: #4da6ff;
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .category[open] > summary::after {
    content: '−';
    color: #ff4d4d;
  }

  .category-content { 
    padding: 15px 20px; 
    background-color: #181818;
    border-top: 1px solid #333;
  }

  /* ================= КАРТОЧКИ ИНТЕРЬЕРОВ ================= */
  .interior { 
    margin-bottom: 12px; 
    border-radius: 8px; 
    background-color: #242424;
    border: 1px solid #333;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .interior:hover {
    border-color: #4da6ff;
    transform: translateX(4px); /* Легкий сдвиг вправо при наведении */
  }

  .interior > summary { 
    cursor: pointer; 
    padding: 14px 18px; 
    font-size: 16px; 
    color: #b0b0b0; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.2s ease;
  }

  .interior > summary:hover { 
    color: #ffffff; 
  }

  /* Иконка раскрытия для карточек */
  .interior > summary::after {
    content: '▼';
    font-size: 12px;
    color: #666;
    transition: transform 0.3s ease;
  }
  .interior[open] > summary::after {
    transform: rotate(180deg);
    color: #4da6ff;
  }
  .interior[open] > summary {
    border-bottom: 1px solid #333;
    color: #4da6ff;
  }

  /* Картинка внутри карточки */
  .interior > img { 
    max-width: 100%; 
    display: block; 
    margin: 0 auto;
    padding: 10px;
    border-radius: 8px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<h1>Каталог интерьеров SAMP</h1>

<!-- ================= РАЗДЕЛ: ДОМА ================= -->
<details class="category">
  <summary>[Дома]</summary>
  <div class="category-content">
    
    <details class="interior">
      <summary>ID 1 — Название дома</summary>
      <img src="001.jpg" alt="Дом 1" loading="lazy">
    </details>

    <details class="interior">
      <summary>ID 2 — Название дома</summary>
      <img src="002.jpg" alt="Дом 2" loading="lazy">
    </details>

  </div>
</details>

<!-- ================= РАЗДЕЛ: БИЗНЕСЫ ================= -->
<details class="category">
  <summary>[Бизнесы]</summary>
  <div class="category-content">
    
    <details class="interior">
      <summary>ID 10 — Название бизнеса</summary>
      <img src="010.jpg" alt="Бизнес 10" loading="lazy">
    </details>

  </div>
</details>

<!-- ================= РАЗДЕЛ: ДРУГОЕ ================= -->
<details class="category">
  <summary>[Другое]</summary>
  <div class="category-content">
    
    <details class="interior">
      <summary>ID 20 — Название интерьера</summary>
      <img src="020.jpg" alt="Интерьер 20" loading="lazy">
    </details>

  </div>
</details>

<!-- ================= РАЗДЕЛ: НЕИСПОЛЬЗУЕМОЕ ================= -->
<details class="category">
  <summary>[Неиспользуемое]</summary>
  <div class="category-content">
    
    <details class="interior">
      <summary>ID 30 — Название интерьера</summary>
      <img src="030.jpg" alt="Интерьер 30" loading="lazy">
    </details>

  </div>
</details>

</body>
</html>
